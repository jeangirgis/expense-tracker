version: '3.8'

services:
  expense-tracker:
    image: ghcr.io/jeangirgis/expense-tracker:latest
    container_name: expense-tracker
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_FILE=/app/secrets/service-account.json
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
    volumes:
      - expense-tracker-secrets:/app/secrets:ro
      - expense-tracker-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - expense-tracker-net

volumes:
  expense-tracker-secrets:
    driver: local
  expense-tracker-uploads:
    driver: local

networks:
  expense-tracker-net:
    driver: bridge
